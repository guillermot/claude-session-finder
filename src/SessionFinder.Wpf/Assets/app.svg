<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude Session Finder — application and notification-area icon.

  The tool answers one question, "which folder did I start this session in?", so the icon is the
  answer and the verb: a folder, with a magnifier laid over it. The magnifier never leaves the body
  of the folder, which is what makes the icon survive a light and a dark taskbar — the only edge the
  background ever meets is the blue silhouette, and mid blue holds against both. A white lens on a
  blue body gives the glyph its own internal contrast, so it does not rely on the taskbar for one.

  This is the drawing used from 32 px upwards. The small sizes are drawn from app-16.svg, whose
  geometry is snapped and whose strokes are thicker, because this one turns to mush below 32.

  The .ico is produced by generate-app-icon.ps1, which holds the same geometry as these files.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <rect x="1" y="2.2" width="6.4" height="3.8" rx="1" ry="1" fill="#7FB2F0" />
  <rect x="1" y="4.1" width="14" height="9.8" rx="1.6" ry="1.6" fill="#4A90E2" />
  <circle cx="7.9" cy="8.6" r="3.05" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="10.3" y1="11" x2="12.3" y2="12.8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
